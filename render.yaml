# ReachInbox Email Scheduler Blueprint v2.1
services:
  # Managed Redis Instance
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

  # Backend API & BullMQ Scheduler Worker
  - type: web
    name: reachinbox-scheduler-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: DELAY_BETWEEN_EMAILS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"

  # Frontend Dashboard (Next.js)
  - type: web
    name: reachinbox-scheduler-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_INTERNAL_URL
        value: https://reachinbox-scheduler-backend-5x7n.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://reachinbox-scheduler-backend-5x7n.onrender.com/api

databases:
  - name: reachinbox-db
    plan: free
